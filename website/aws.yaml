AWSTemplateFormatVersion: '2010-09-09'
Description: Tandryx static public website - private S3, CloudFront OAC and narrow GitHub OIDC deployment access
Parameters:
  DomainName:
    Type: String
    Default: tandryx.js.org
  AdditionalDomainName:
    Type: String
    Default: ''
    Description: Optional second owned domain served by the same site; must be covered by CertificateArn
  CertificateArn:
    Type: String
    Default: ''
    Description: Issued non-exportable ACM certificate in us-east-1; leave empty until DNS validation completes
  CreateGitHubOidc:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  IncludeWww:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable only if the additional www name is owned and covered by the certificate
Conditions:
  HasDomain: !Not [!Equals [!Ref CertificateArn, '']]
  NeedsOidc: !Equals [!Ref CreateGitHubOidc, 'true']
  HasWww: !And [!Condition HasDomain, !Equals [!Ref IncludeWww, 'true']]
  HasAdditionalDomain: !And [!Condition HasDomain, !Not [!Equals [!Ref AdditionalDomainName, '']]]
Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'tandryx-website-${AWS::AccountId}-${AWS::Region}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: Tandryx
        - Key: Purpose
          Value: PublicWebsite
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: tandryx-website
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Tandryx public static website
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          !If [
            HasWww,
            !If [
              HasAdditionalDomain,
              [!Ref DomainName, !Sub 'www.${DomainName}', !Ref AdditionalDomainName],
              [!Ref DomainName, !Sub 'www.${DomainName}'],
            ],
            !If [
              HasAdditionalDomain,
              [!Ref DomainName, !Ref AdditionalDomainName],
              !If [HasDomain, [!Ref DomainName], !Ref 'AWS::NoValue'],
            ],
          ]
        Origins:
          - Id: private-website
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccess
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: private-website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed policy honors S3 Cache-Control, excludes cookies/query strings.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: Tandryx
        - Key: Purpose
          Value: PublicWebsite
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt WebsiteBucket.Arn, !Sub '${WebsiteBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: NeedsOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  WebsiteDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tandryx-website-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                !If [
                  NeedsOidc,
                  !Ref GitHubOidc,
                  !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com',
                ]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:GishReloaded@42474995/tandryx@1338785076:ref:refs/heads/main
      Policies:
        - PolicyName: PublishOnlyTandryxWebsite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${WebsiteBucket.Arn}/*'
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'
Outputs:
  BucketName:
    Value: !Ref WebsiteBucket
  DistributionId:
    Value: !Ref WebsiteDistribution
  CloudFrontDomain:
    Value: !GetAtt WebsiteDistribution.DomainName
  WebsiteUrl:
    Value: !Sub 'https://${WebsiteDistribution.DomainName}'
  DeployRoleArn:
    Value: !GetAtt WebsiteDeployRole.Arn
