name: GitHub release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tandryx
          POSTGRES_PASSWORD: tandryx
          POSTGRES_DB: tandryx_release_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tandryx -d tandryx_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tandryx:tandryx@localhost:5432/tandryx_release_test
      TEST_DATABASE_URL: postgres://tandryx:tandryx@localhost:5432/tandryx_release_test
      JWT_SECRET: release-test-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version)throw Error('Tag/version mismatch')"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:pack
      - run: docker build -t tandryx:release .
      - name: Publish source release and package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tmp/release/*.tgz tmp/release/SHA256SUMS --title "Tandryx $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" --verify-tag
