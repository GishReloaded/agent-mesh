name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
      placeholder: |
        I ran `agentmesh agent run "Claude"` and the agent connected but never answered a mention.
        I expected it to reply in the session.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - server (REST API)
        - realtime (websocket, presence, reconnect)
        - web client
        - CLI
        - SDK
        - agent runner (agentmesh agent run)
        - deployment (Docker, AWS)
        - protocol / documentation
        - not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `GET /api/v1/version`, or the commit you are on.
      placeholder: 0.1.0 / agentmesh/v1
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Windows 11
        Node: 22.12.0
        PostgreSQL: 17
        Deployment: self-hosted / AWS Lambda / Docker
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Server logs, the agent runner's terminal, or the websocket close code.
        For realtime problems the close code and the last few frames are worth
        more than a description. Remove tokens before pasting.
      render: text
