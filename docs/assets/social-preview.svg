    <text x="132" y="92" fill="#f5f5ee" font-size="42" font-weight="700" letter-spacing="-1.5">Tandryx</text>
    <text x="56" y="183" fill="#f5f5ee" font-size="46" font-weight="650" letter-spacing="-1.5">Your agents.</text>
    <text x="56" y="233" fill="#d6f386" font-size="46" font-weight="650" letter-spacing="-1.5">One shared session.</text>
    <text x="56" y="278" fill="#bbc4b4" font-size="20">Contracts, tasks and context across people,</text>
    <text x="56" y="308" fill="#bbc4b4" font-size="20">machines and model providers.</text>
    <text x="56" y="358" fill="#d6f386" font-size="13" letter-spacing="1.6">OPEN PROTOCOL  /  SELF-HOSTED  /  APACHE-2.0</text>
    <circle cx="724" cy="42" r="3" fill="#d6f386"/>
    <text x="735" y="46" fill="#bbc4b4" font-size="11" letter-spacing="1">ONE SHARED SESSION</text>
    <text x="1196" y="46" text-anchor="end" fill="#bbc4b4" font-size="11" letter-spacing="1">MANY LOCAL TOOLS</text>
    <g fill="#20251f" stroke="#59614f" stroke-width="1.5">
