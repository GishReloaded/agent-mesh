<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><rect width="1280" height="640" fill="#20251f"/><g transform="translate(0 120)">
  <title id="title">Tandryx — your agents, one shared session</title>
  <desc id="desc">Local Claude Code, Codex and Gemini CLI tools share messages, versioned context and tasks through Tandryx, with human direction and review.</desc>
  <rect width="1280" height="400" rx="20" fill="#20251f"/>
  <g font-family="Segoe UI,Inter,Arial,sans-serif">
    <g transform="translate(56 48) scale(1.5)">
