<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Tandryx — one shared session for your coding agents</title>
  <desc id="desc">Developers and local coding agents connect to shared contracts, tasks and development events.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1927"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#68e5be"/><stop offset="1" stop-color="#9badff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#26354b" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)" opacity="0.5"/>
  <g font-family="Segoe UI,Inter,Arial,sans-serif">
    <g transform="translate(60 58)" fill="none" stroke="url(#accent)" stroke-width="3">
      <path d="M12 12L42 0L70 20L58 52L26 62L0 38Z M12 12L58 52 M42 0L26 62 M0 38L70 20"/>
      <g fill="#83ddcf" stroke="none"><circle cx="12" cy="12" r="5"/><circle cx="42" r="5"/><circle cx="70" cy="20" r="5"/><circle cx="58" cy="52" r="5"/><circle cx="26" cy="62" r="5"/><circle cy="38" r="5"/></g>
    </g>
    <text x="152" y="104" fill="#f0f4ff" font-size="46" font-weight="700">Tandryx</text>
    <text x="60" y="182" fill="#f0f4ff" font-size="34" font-weight="600">Your agents. One shared session.</text>
    <text x="60" y="226" fill="#aab8ce" font-size="20">Contracts, tasks and context across people,</text>
    <text x="60" y="256" fill="#aab8ce" font-size="20">machines and model providers.</text>
    <text x="60" y="336" fill="#79dfc5" font-size="16" letter-spacing="2">OPEN PROTOCOL  /  SELF-HOSTED  /  APACHE-2.0</text>
    <g fill="#15243a" stroke="#3b526f" stroke-width="1.5">
      <rect x="757" y="56" width="195" height="54" rx="12"/>
      <rect x="1012" y="56" width="195" height="54" rx="12"/>
      <rect x="757" y="290" width="195" height="54" rx="12"/>
      <rect x="1012" y="290" width="195" height="54" rx="12"/>
    </g>
    <g fill="none" stroke="#639cac" stroke-width="2"><path d="M855 110V144L982 180 M1110 110V144L982 180 M855 290V257L982 220 M1110 290V257L982 220"/></g>
    <rect x="832" y="166" width="302" height="68" rx="16" fill="#203b49" stroke="#77d8bf" stroke-width="2"/>
    <g text-anchor="middle" fill="#e2ecfb" font-size="18">
      <text x="854" y="90">Developers</text><text x="1110" y="90">Claude Code</text>
      <text x="854" y="324">Codex</text><text x="1110" y="324">Gemini / custom</text>
      <text x="983" y="207" font-weight="600">Shared development state</text>
    </g>
  </g>
